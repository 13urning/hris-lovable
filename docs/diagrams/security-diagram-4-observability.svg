<svg viewBox="0 0 1000 690" width="1000" height="690" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&amp;display=swap');
    text { font-family: 'Montserrat', sans-serif; }
    .title { font-size: 15px; font-weight: 700; fill: #010101; }
    .node-t { fill: #036A6B; }
    .node-tl { fill: #15A6A1; }
    .node-g { fill: #393939; }
    .nlabel { font-size: 11px; font-weight: 700; fill: #FFFFFF; }
    .nsub { font-size: 8.5px; font-weight: 400; fill: #c8eeee; }
    .nsubg { font-size: 8.5px; font-weight: 400; fill: #cccccc; }
    .elabel { font-size: 9px; font-weight: 600; fill: #036A6B; }
    .elabel2 { font-size: 8.5px; font-weight: 400; fill: #393939; }
    .zone { font-size: 10px; font-weight: 700; fill: #036A6B; }
    .edge { stroke: #036A6B; stroke-width: 1.6; fill: none; marker-end: url(#arrB); }
    .edgeg { stroke: #393939; stroke-width: 1.3; fill: none; marker-end: url(#arrG); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#036A6B"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#393939"/>
    </marker>
  </defs>

  <text x="500" y="30" text-anchor="middle" class="title">FIGURE 4 — OBSERVABILITY AND LOG PIPELINE</text>
  <line x1="250" y1="42" x2="750" y2="42" stroke="#036A6B" stroke-width="2"/>

  <!-- ── Zone: Cloud Run container ── -->
  <rect x="206" y="72" width="436" height="352" rx="8" fill="#F5FAFA" stroke="#15A6A1" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="424" y="92" text-anchor="middle" class="zone">CLOUD RUN — wave-hris (Nitro node-server)</text>

  <!-- Left column: event sources -->
  <rect x="20" y="106" width="170" height="74" rx="6" class="node-tl"/>
  <text x="105" y="130" text-anchor="middle" class="nlabel">Browser — RPC / SSR</text>
  <text x="105" y="147" text-anchor="middle" class="nsub">106 server functions</text>
  <text x="105" y="160" text-anchor="middle" class="nsub">Firebase ID token per call</text>
  <text x="105" y="173" text-anchor="middle" class="nsub">X-Cloud-Trace-Context header</text>

  <rect x="20" y="200" width="170" height="62" rx="6" class="node-tl"/>
  <text x="105" y="224" text-anchor="middle" class="nlabel">Attendance device</text>
  <text x="105" y="241" text-anchor="middle" class="nsub">X-Device-Key, raw HTTP</text>
  <text x="105" y="254" text-anchor="middle" class="nsub">no human session</text>

  <rect x="20" y="290" width="170" height="78" rx="6" class="node-g"/>
  <text x="105" y="314" text-anchor="middle" class="nlabel">Process-level faults</text>
  <text x="105" y="331" text-anchor="middle" class="nsubg">process.on uncaughtException</text>
  <text x="105" y="344" text-anchor="middle" class="nsubg">process.on unhandledRejection</text>
  <text x="105" y="357" text-anchor="middle" class="nsubg">pool.on error (pg idle client)</text>

  <!-- Layer 1: request context -->
  <rect x="220" y="104" width="408" height="66" rx="6" class="node-t"/>
  <text x="424" y="128" text-anchor="middle" class="nlabel">1 · src/server.ts — request context (AsyncLocalStorage)</text>
  <text x="424" y="145" text-anchor="middle" class="nsub">traceId parsed from X-Cloud-Trace-Context, requestId, method, path, APP_ENV</text>
  <text x="424" y="158" text-anchor="middle" class="nsub">one user action becomes one correlated thread in Log Explorer</text>

  <!-- Layer 2: middleware -->
  <rect x="220" y="182" width="408" height="82" rx="6" class="node-t"/>
  <text x="424" y="206" text-anchor="middle" class="nlabel">2 · auth-middleware.ts — observability wrapper</text>
  <text x="424" y="223" text-anchor="middle" class="nsub">try { await next() } catch { logError(...); throw err } — rethrows unchanged</text>
  <text x="424" y="236" text-anchor="middle" class="nsub">adds serverFn name, dbUserId / firebaseUid, latency, outcome</text>
  <text x="424" y="249" text-anchor="middle" class="nsub">single choke point: 102 authMiddleware + 4 strictAuthMiddleware</text>

  <!-- Layer 3: redaction -->
  <rect x="220" y="276" width="408" height="74" rx="6" class="node-tl"/>
  <text x="424" y="300" text-anchor="middle" class="nlabel">3 · log-redact.ts — ALLOWLIST GATE (RA 10173)</text>
  <text x="424" y="317" text-anchor="middle" class="nsub">emits only: err.name, code (SQLSTATE), constraint, severity, routine, stack</text>
  <text x="424" y="330" text-anchor="middle" class="nsub">hard-drops: detail, hint, where, internalQuery, parameters, request bodies</text>
  <text x="424" y="343" text-anchor="middle" class="nsub">final sweep: email + long digit-run scrub (TIN / SSS / PhilHealth / Pag-IBIG)</text>

  <!-- Layer 4: stdout -->
  <rect x="220" y="362" width="408" height="34" rx="6" class="node-g"/>
  <text x="424" y="383" text-anchor="middle" class="nlabel">stdout — one Cloud Logging JSON object per line</text>

  <!-- ── Right column: GCP observability ── -->
  <rect x="666" y="104" width="316" height="68" rx="6" class="node-t"/>
  <text x="824" y="128" text-anchor="middle" class="nlabel">Cloud Logging — ingest and parse</text>
  <text x="824" y="145" text-anchor="middle" class="nsub">severity, trace, spanId, labels, httpRequest</text>
  <text x="824" y="158" text-anchor="middle" class="nsub">no agent, no sidecar, no second service</text>

  <rect x="666" y="190" width="316" height="100" rx="6" class="node-g"/>
  <text x="824" y="214" text-anchor="middle" class="nlabel">Log Router — retention and access</text>
  <text x="824" y="231" text-anchor="middle" class="nsubg">prod bucket — 90 days, restricted Log View</text>
  <text x="824" y="244" text-anchor="middle" class="nsubg">staging _Default — 30 days</text>
  <text x="824" y="257" text-anchor="middle" class="nsubg">security-audit view — 400 days (narrow scope)</text>
  <text x="824" y="270" text-anchor="middle" class="nsubg">reader: wave-hris-log-readers group (IAM)</text>

  <rect x="666" y="308" width="316" height="62" rx="6" class="node-tl"/>
  <text x="824" y="332" text-anchor="middle" class="nlabel">Error Reporting</text>
  <text x="824" y="349" text-anchor="middle" class="nsub">groups by signature via the ReportedErrorEvent @type</text>
  <text x="824" y="362" text-anchor="middle" class="nsub">notifies on a NEW error signature</text>

  <rect x="666" y="388" width="316" height="62" rx="6" class="node-tl"/>
  <text x="824" y="412" text-anchor="middle" class="nlabel">Log-based metrics</text>
  <text x="824" y="429" text-anchor="middle" class="nsub">server_fn_calls / server_fn_errors, labelled by fn + env</text>
  <text x="824" y="442" text-anchor="middle" class="nsub">enables per-function failure alerting</text>

  <!-- Alerting bar -->
  <rect x="206" y="478" width="776" height="76" rx="6" class="node-t"/>
  <text x="594" y="502" text-anchor="middle" class="nlabel">Cloud Monitoring alert policies → Email + Google Chat webhook (business-hours response)</text>
  <text x="594" y="519" text-anchor="middle" class="nsub">new error signature · any single server function ≥5 errors / 10 min · error ratio &gt;5% / 10 min · Cloud Run 5xx class</text>
  <text x="594" y="532" text-anchor="middle" class="nsub">uptime check on prod / · Cloud SQL CPU &gt;80% and disk &gt;85% · log ingestion &gt;25 GiB per month (cost guard)</text>
  <text x="594" y="545" text-anchor="middle" class="nsub">all policies filtered by APP_ENV so production pages and staging does not</text>

  <!-- Edges: sources into the container -->
  <path class="edge" d="M 190 141 L 220 132"/>
  <path class="edge" d="M 190 231 C 204 231, 208 180, 220 160"/>
  <path class="edgeg" d="M 190 329 C 204 329, 208 320, 220 312"/>

  <!-- Edges: through the layers -->
  <path class="edge" d="M 424 170 L 424 182"/>
  <path class="edge" d="M 424 264 L 424 276"/>
  <path class="edge" d="M 424 350 L 424 362"/>

  <!-- Container to Cloud Logging -->
  <path class="edge" d="M 628 379 C 650 379, 654 190, 666 142"/>
  <text x="300" y="446" class="elabel">stdout capture — Cloud Run native, no agent and no sidecar</text>

  <!-- Cloud Logging fan-out -->
  <path class="edge" d="M 824 172 L 824 190"/>
  <path class="edge" d="M 824 290 L 824 308"/>
  <path class="edge" d="M 824 370 L 824 388"/>
  <path class="edge" d="M 824 450 L 824 478"/>

  <!-- Footnote -->
  <rect x="20" y="572" width="962" height="104" rx="6" fill="#F5FAFA"/>
  <text x="38" y="596" class="elabel" style="font-size:10.5px">WHY THIS CLOSES THE 23 JULY 2026 BLIND SPOT</text>
  <text x="38" y="614" class="elabel2" style="font-size:9.5px">• A server-function throw is serialized to the client by the TanStack Start transport. It never reaches the request middleware in start.ts or the fetch catch in server.ts.</text>
  <text x="38" y="630" class="elabel2" style="font-size:9.5px">• That is why a Postgres 42P08 broke all leave filing for four days with zero log entries. Layer 2 sits INSIDE the server-fn boundary, the only place the throw is observable.</text>
  <text x="38" y="646" class="elabel2" style="font-size:9.5px">• It logs stack + SQLSTATE then rethrows the error unchanged. Every log call is try-caught and fails open: a logger fault degrades a log line, never a request.</text>
  <text x="38" y="662" class="elabel2" style="font-size:9.5px">• Layer 3 is allowlist-based, so a new PII field is excluded by default rather than leaked by default. Detection target: under 15 minutes, versus 4 days by employee email report.</text>
</svg>
