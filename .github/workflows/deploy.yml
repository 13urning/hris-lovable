name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Keyless auth via GitHub OIDC -> Workload Identity Federation.
permissions:
  contents: read
  id-token: write              # required to mint the OIDC token

env:
  PROJECT_ID: wave-hris-498916
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/wave-hris-498916/wave-hris/app

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/831274499203/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@wave-hris-498916.iam.gserviceaccount.com

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            .

      - name: Push to Artifact Registry
        run: docker push --all-tags $IMAGE

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy wave-hris \
            --image=$IMAGE:${{ github.sha }} \
            --region=$REGION \
            --platform=managed \
            --quiet
